repos_root = "~/repos"

[agents]
# --no-daemon: without it Codex (seen with 0.162) runs a shared per-user server
# inside the first Codex session's scope, and every other Codex session's
# commands run there too. Stopping or closing that first session then breaks the
# others, and it never leaves the list by itself. Use ["codex"] only for a Codex
# too old to know the flag.
codex = ["codex", "--no-daemon"]
claude = ["claude", "--permission-mode", "bypassPermissions"]
# terminal defaults to valid $SHELL / passwd shell with normal rc files
# terminal = ["/bin/bash", "-i"]

[github]
# Empty owner lists repositories owned by the authenticated user.
owner = ""
cache_ttl = 600
clone_timeout = 300

[stop]
agent_int_grace = 3
agent_term_grace = 2
terminal_hup_grace = 1
terminal_term_grace = 1
kill_grace = 2

[ui]
# Seconds between live refreshes of the menu (only changed lines are redrawn).
refresh = 2
color = true
# false replaces the Unicode icons and spinner with plain ASCII.
icons = true

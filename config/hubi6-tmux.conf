# Hubi v6 owns this server. Never import v5 runtime configuration.
source-file -q ~/.tmux.conf
set -g exit-empty off
set -g remain-on-exit on
# Follow the client that was used last: a phone is not left with a cropped
# slice of a window sized for a larger, idle client.
set -g window-size latest
# Say where you are. Each workload sets @hubi6-label and its own status colour.
set -g status-left ' #{?@hubi6-label,#{@hubi6-label},#S} '
set -g status-left-length 40
# The session-list hint is shown only where it cannot collide with the label.
set -g status-right '#{?#{e|>=:#{client_width},90}, ^b s lista |,} ^b d menu | %H:%M '
set -g status-right-length 40
set -g window-status-format ''
set -g window-status-current-format ''
set -g update-environment ''
set-hook -g after-set-option[900] 'set -g exit-empty off'
# New manual windows/panes cannot silently escape per-workload cgroups.
unbind c
unbind %
unbind '"'
bind c display-message 'Nową sesję uruchom z menu Hubi: Ctrl-b d'
bind % display-message 'Nową sesję uruchom z menu Hubi: Ctrl-b d'
bind '"' display-message 'Nową sesję uruchom z menu Hubi: Ctrl-b d'
unbind '<'
unbind '>'
# Session list with readable names instead of generation hashes.
bind s choose-tree -Zs -F '#{?@hubi6-label,#{@hubi6-label},#{session_name}}'
# A suspended client cannot be resumed when its launcher is the login shell.
unbind C-z
unbind -T root MouseDown3Pane
unbind -T root MouseDown3StatusRight

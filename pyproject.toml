[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "hubi6"
version = "6.0.0"
description = "Isolated systemd/tmux workloads and GitHub repository browser"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hubi = "hubi6.cli:main"
hubi6 = "hubi6.cli:main"

[tool.setuptools.packages.find]
include = ["hubi6*"]
